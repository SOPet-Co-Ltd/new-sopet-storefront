# SOPET Storefront CI
# Lite (format + lint + forbidden-import guard): PRs whose base is NOT deploy/production or deploy/uat
# Full (lint + test + build + forbidden-import guard): PRs targeting deploy/production or deploy/uat
# Security (yarn audit): all PRs; advisory (continue-on-error) while known highs remain

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout storefront
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Yarn classic: --level high fails when high/critical exist (exit bitmask).
      # Transitive highs under next currently block a hard gate; keep advisory
      # (continue-on-error) until the dependency tree clears.
      - name: Dependency audit (high+)
        continue-on-error: true
        run: yarn audit --level high --groups dependencies

  lite:
    if: github.base_ref != 'deploy/production' && github.base_ref != 'deploy/uat'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout storefront
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Forbidden import guard
        run: bash scripts/check-forbidden-imports.sh

  full:
    if: github.base_ref == 'deploy/production' || github.base_ref == 'deploy/uat'
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:3002/graphql
      NEXT_PUBLIC_OMISE_PUBLIC_KEY: pkey_test_ci_dummy

    steps:
      - name: Checkout storefront
        uses: actions/checkout@v4

      - name: Checkout backend schema
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/new-sopet-backend
          path: sopet-backend
          sparse-checkout: |
            src/schema.gql
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build
        env:
          GRAPHQL_SCHEMA_PATH: sopet-backend/src/schema.gql
        run: yarn build

      - name: Forbidden import guard
        run: bash scripts/check-forbidden-imports.sh
