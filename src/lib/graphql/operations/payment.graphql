fragment PaymentFields on PaymentType {
  id
  orderId
  orderNumber
  amount
  currency
  status
  paymentMethod
  authorizeUri
  qrCodeUrl
  expiresAt
}

query Payment($id: String!, $guestPayToken: String) {
  payment(id: $id, guestPayToken: $guestPayToken) {
    ...PaymentFields
  }
}

query PaymentByOrderId($orderId: String!, $guestPayToken: String) {
  paymentByOrderId(orderId: $orderId, guestPayToken: $guestPayToken) {
    ...PaymentFields
  }
}

query BankTransferDetails {
  bankTransferDetails {
    bankName
    accountName
    accountNumber
  }
}

subscription PaymentStatusUpdated($paymentId: String, $orderId: String, $guestPayToken: String) {
  paymentStatusUpdated(paymentId: $paymentId, orderId: $orderId, guestPayToken: $guestPayToken) {
    ...PaymentFields
  }
}
